plugins {
//    id 'kotlin-android'
    id 'com.android.application'
}


android {
    namespace = "dk.blekinge.dicerolla"
    compileSdkVersion = 37
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    defaultConfig {
        applicationId = "dk.blekinge.dicerolla"
        minSdkVersion 34
        targetSdkVersion 35
        versionCode 1
        versionName = "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        baseline = file("lint-baseline.xml")
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

}


ext {
    androidXTestVersion = "1.7.0"
}

dependencies {

    implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.3.0"))

    implementation 'androidx.core:core-ktx:1.19.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib"

// Source: https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    // Source: https://mvnrepository.com/artifact/org.apache.commons/commons-collections4
    implementation 'org.apache.commons:commons-collections4:4.5.0'

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Source: https://mvnrepository.com/artifact/androidx.annotation/annotation-jvm
    implementation 'androidx.annotation:annotation-jvm:1.10.0'

    // Source: https://mvnrepository.com/artifact/androidx.constraintlayout/constraintlayout
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation 'androidx.collection:collection-jvm:1.6.0'
    implementation 'androidx.collection:collection:1.6.0'

    // Required -- JUnit 4 framework
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    implementation "org.jetbrains.kotlin:kotlin-test:2.2.10"

}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}