plugins {
//    id 'kotlin-android'
    id 'com.android.application'
    id("org.jetbrains.kotlin.plugin.compose")

    // Kotlin serialization plugin for type safe routes and navigation arguments
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.0.21'
    id("org.jetbrains.kotlin.plugin.parcelize")

}


android {
    namespace = "dk.blekinge.dicerolla"
    compileSdkVersion = 37
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    defaultConfig {
        applicationId = "dk.blekinge.dicerolla"
        minSdkVersion 34
        targetSdkVersion 35
        versionCode 1
        versionName = "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose true
    }
    lint {
        baseline = file("lint-baseline.xml")
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

}

composeCompiler {
    reportsDestination = layout.buildDirectory.dir("compose_compiler")
    stabilityConfigurationFile = rootProject.layout.projectDirectory.file("stability_config.conf")
}


dependencies {
    // Jetpack Compose BOM (ensures consistent versions)
    def composeBom = platform('androidx.compose:compose-bom:2026.06.01')
    implementation composeBom
    androidTestImplementation composeBom


    // ADD THIS LINE FOR ACTIVITY-COMPOSE DEPENDENCY
    implementation "androidx.activity:activity-compose"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose'
    // Core Compose libraries
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'

    // Navigation for Compose
    implementation "androidx.navigation:navigation-compose:2.9.8"

    implementation "androidx.compose.material:material-icons-core"

    // ViewModel for state management
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"

    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"

    // Other existing dependencies (keep them)
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    // ... (other dependencies)
    // 2. Add JUnit BOM and the required dependencies
    testImplementation(platform("org.junit:junit-bom:5.14.1"))
    testImplementation("org.junit.jupiter:junit-jupiter-api")
//    testImplementation("org.junit.jupiter:junit-jupiter-params")
//    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
    testImplementation 'org.assertj:assertj-core:3.27.7'


    androidTestImplementation(platform("org.junit:junit-bom:5.14.1"))

    // Test rules and transitive dependencies:
    androidTestImplementation("androidx.compose.ui:ui-test-junit4")
    androidTestImplementation("org.junit.jupiter:junit-jupiter-api")
    androidTestImplementation("org.junit.jupiter:junit-jupiter-engine")

// Needed for createComposeRule(), but not for createAndroidComposeRule<YourActivity>():
    debugImplementation("androidx.compose.ui:ui-test-manifest")

}


tasks.withType(Test).configureEach {
    useJUnitPlatform()
}