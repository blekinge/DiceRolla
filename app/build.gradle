plugins {
//    id 'kotlin-android'
    id 'com.android.application'
    id("org.jetbrains.kotlin.plugin.compose")

    // Kotlin serialization plugin for type safe routes and navigation arguments
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.0.21'
}


android {
    namespace = "dk.blekinge.dicerolla"
    compileSdkVersion = 37
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    defaultConfig {
        applicationId = "dk.blekinge.dicerolla"
        minSdkVersion 34
        targetSdkVersion 35
        versionCode 1
        versionName = "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose true
    }
    lint {
        baseline = file("lint-baseline.xml")
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

}

composeCompiler {
    reportsDestination = layout.buildDirectory.dir("compose_compiler")
    stabilityConfigurationFile = rootProject.layout.projectDirectory.file("stability_config.conf")
}


dependencies {

    implementation 'androidx.compose.foundation:foundation-layout:1.11.4'
    implementation 'androidx.compose.ui:ui-unit:1.11.4'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'androidx.navigation:navigation-runtime-ktx:2.9.8'
    def composeBom = platform('androidx.compose:compose-bom:2026.06.01')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.material3:material3'

    // Android Studio Preview support
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.core:core-ktx:1.19.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib"

    // UI Tests
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Optional - Integration with activities
    implementation 'androidx.activity:activity-compose:1.13.0'
    // Optional - Integration with ViewModels
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'

// Source: https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    // Source: https://mvnrepository.com/artifact/org.apache.commons/commons-collections4
    implementation 'org.apache.commons:commons-collections4:4.5.0'

//    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Source: https://mvnrepository.com/artifact/androidx.annotation/annotation-jvm
    implementation 'androidx.annotation:annotation-jvm:1.10.0'

    // Source: https://mvnrepository.com/artifact/androidx.constraintlayout/constraintlayout
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    //https://mvnrepository.com/artifact/androidx.collection/collection-jvm
    implementation 'androidx.collection:collection-jvm:1.6.0'
    // https://mvnrepository.com/artifact/androidx.collection/collection
    implementation 'androidx.collection:collection:1.6.0'

    // Required -- JUnit 4 framework
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'

    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation "org.jetbrains.kotlin:kotlin-test:2.3.0"


    def nav_version = "2.9.8"

    // Jetpack Compose Integration
    implementation "androidx.navigation:navigation-compose:$nav_version"

    // Views/Fragments Integration
    implementation "androidx.navigation:navigation-fragment:$nav_version"
    implementation "androidx.navigation:navigation-ui:$nav_version"

    // Feature module support for Fragments
    implementation "androidx.navigation:navigation-dynamic-features-fragment:$nav_version"

    // Testing Navigation
    androidTestImplementation "androidx.navigation:navigation-testing:$nav_version"

    // JSON serialization library, works with the Kotlin serialization plugin.
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
}


tasks.withType(Test).configureEach {
    useJUnitPlatform()
}